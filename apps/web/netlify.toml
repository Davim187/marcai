[build]
  base = "apps/web"
  command = "cd ../.. && pnpm install --frozen-lockfile && pnpm --filter @marcai/web exec vite build"
  publish = "dist"

# Troque SUA-API pelo domínio da API (Railway/Render)
[[redirects]]
  from = "/api/*"
  to = "https://SUA-API.up.railway.app/api/:splat"
  status = 200
  force = true
[[redirects]]
  from = "/uploads/*"
  to = "https://SUA-API.up.railway.app/uploads/:splat"
  status = 200
[[redirects]]
  from = "/sitemap.xml"
  to = "https://SUA-API.up.railway.app/sitemap.xml"
  status = 200
[[redirects]]
  from = "/robots.txt"
  to = "https://SUA-API.up.railway.app/robots.txt"
  status = 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeçalhos de segurança (os mesmos que a API envia quando serve o front)
[[headers]]
  for = "/*"
  [headers.values]
    content-security-policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    x-frame-options = "DENY"
    x-content-type-options = "nosniff"
    referrer-policy = "strict-origin-when-cross-origin"
    permissions-policy = "camera=(), microphone=(), geolocation=()"
    strict-transport-security = "max-age=31536000; includeSubDomains"
